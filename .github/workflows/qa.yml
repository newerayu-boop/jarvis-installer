name: QA — проверка перед выдачей ученикам

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Прогнать QA
        id: qa
        run: bash qa/run.sh
        env:
          NO_COLOR: '1'

      - name: Показать отчёт в сводке
        if: always()
        run: cat qa/report/BUGS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa/report/
